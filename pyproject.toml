[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-call-audit"
version = "0.1.0"
description = "Dependency-free guardrail layer for agent tool calls with a tamper-evident audit trail"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[tool.setuptools]
packages = ["audit_guard"]
